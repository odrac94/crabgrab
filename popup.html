<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0b1220;
      --surface: #121a2b;
      --surface-2: #18233a;
      --border: #22304a;
      --text: #e6edf6;
      --muted: #8b9bb4;
      --accent: #22d3ee;
      --accent-2: #0ea5e9;
      --hd: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      width: 288px;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    /* Brand header */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 12px;
      background:
        radial-gradient(120% 140% at 0% 0%, rgba(34,211,238,0.14), transparent 60%),
        var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 34px; height: 34px; flex: none;
      border-radius: 10px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 4px 14px rgba(14,165,233,0.35);
    }
    .logo svg { width: 20px; height: 20px; display: block; }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: -0.2px; font-weight: 700; }
    .brand .tag { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .body { padding: 14px 16px 16px; }
    .hint {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 12px; color: var(--muted); line-height: 1.45;
      margin: 0 0 14px;
    }
    .hint .kbd {
      flex: none; margin-top: 1px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 1px 6px; color: var(--text); font-size: 12px;
    }
    /* Setting toggle */
    .setting {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; margin: 0 0 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
    }
    .setting .txt { flex: 1; }
    .setting .txt b { display: block; font-size: 12.5px; font-weight: 600; }
    .setting .txt small { color: var(--muted); font-size: 11px; }
    /* iOS-style switch */
    .switch { position: relative; width: 38px; height: 22px; flex: none; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch .track {
      position: absolute; inset: 0; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--border);
      transition: background 0.18s;
    }
    .switch .thumb {
      position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #6b7a94; transition: transform 0.18s, background 0.18s;
    }
    .switch input:checked ~ .track { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
    .switch input:checked ~ .thumb { transform: translateX(16px); background: #fff; }
    /* Buttons */
    button {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px; border: none; border-radius: 10px;
      font-size: 13.5px; font-weight: 600; cursor: pointer;
      color: #fff; transition: filter 0.14s, transform 0.06s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.98); }
    button svg { width: 16px; height: 16px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgba(14,165,233,0.3); }
    .btn-ghost { background: var(--surface); border: 1px solid var(--border); margin-top: 8px; }
    #status { font-size: 12px; margin-top: 12px; color: var(--accent); min-height: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo">
      <!-- dolphin-ish arrow: download mark -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/>
      </svg>
    </div>
    <div>
      <h1>Delpix</h1>
      <div class="tag">Imágenes en máxima resolución</div>
    </div>
  </div>

  <div class="body">
    <p class="hint">
      <span class="kbd">⬇</span>
      Pasa el cursor sobre cualquier imagen y pulsa el botón, o clic derecho → <b>Descargar imagen</b>.
    </p>

    <label class="setting">
      <span class="txt">
        <b>Buscar tamaño completo</b>
        <small>Prueba variantes de la URL y descarga la más grande.</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="probe">
        <span class="track"></span>
        <span class="thumb"></span>
      </span>
    </label>

    <button id="all" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17 14v7M13.5 17.5h7"/></svg>
      Descargar todas las imágenes
    </button>
    <button id="net" class="btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="9" cy="9" r="1.4"/></svg>
      Imágenes de red (galería)
    </button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
