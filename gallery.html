<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Delpix — Galería de imágenes</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --surface: #121a2b;
      --surface-2: #18233a;
      --border: #22304a;
      --text: #e6edf6;
      --muted: #8b9bb4;
      --accent: #22d3ee;
      --accent-2: #0ea5e9;
      --hd: #34d399;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 12px 18px;
      background:
        radial-gradient(80% 180% at 0% 0%, rgba(34,211,238,0.12), transparent 60%),
        rgba(18,26,43,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
    .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 12px rgba(14,165,233,0.3); }
    .logo svg { width: 17px; height: 17px; }
    .brand h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -0.2px; }
    .count { color: var(--muted); font-size: 13px; margin-right: auto; }

    button, select {
      padding: 8px 13px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
      transition: filter 0.14s, transform 0.06s;
    }
    button:hover, select:hover { filter: brightness(1.12); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.55; cursor: progress; filter: none; }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent;
      color: #06121f; font-weight: 700; box-shadow: 0 4px 14px rgba(14,165,233,0.3);
    }
    label.chk { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
    label.chk input { accent-color: var(--accent); width: 15px; height: 15px; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px; padding: 18px;
    }
    .card {
      position: relative; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; cursor: pointer;
      transition: border-color 0.12s, transform 0.1s, box-shadow 0.12s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
    .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .thumb-wrap { position: relative; height: 160px; }
    .card .thumb {
      width: 100%; height: 100%; object-fit: contain; display: block;
      background: repeating-conic-gradient(#141c2e 0% 25%, #1a2337 0% 50%) 50% / 22px 22px;
    }
    .card .meta { padding: 9px 11px; }
    .card .dims { color: var(--accent); font-weight: 700; font-size: 12px; }
    .card .name { color: var(--muted); font-size: 11px; word-break: break-all; margin-top: 3px; line-height: 1.35; }
    .card input.sel-box {
      position: absolute; top: 9px; left: 9px; width: 19px; height: 19px; z-index: 3;
      accent-color: var(--accent); cursor: pointer;
    }
    .card .badge {
      position: absolute; top: 8px; right: 9px; z-index: 2;
      background: var(--hd); color: #05130c; font-size: 10px; font-weight: 800;
      padding: 2px 7px; border-radius: 6px; letter-spacing: 0.3px;
    }
    /* Quick-download button on hover */
    .card .quick {
      position: absolute; bottom: 9px; right: 9px; z-index: 3;
      width: 34px; height: 34px; padding: 0; border-radius: 9px;
      background: rgba(11,18,32,0.82); border: 1px solid var(--border);
      display: grid; place-items: center;
      opacity: 0; transform: translateY(4px); transition: opacity 0.14s, transform 0.14s;
    }
    .thumb-wrap:hover .quick, .card.sel .quick { opacity: 1; transform: translateY(0); }
    .card .quick:hover { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
    .card .quick svg { width: 17px; height: 17px; }
    .card .quick.done { background: var(--hd); border-color: transparent; }

    .empty {
      padding: 60px 24px; text-align: center; color: var(--muted); max-width: 520px; margin: 0 auto; line-height: 1.6;
    }
    .empty svg { width: 44px; height: 44px; opacity: 0.4; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#06121f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="9" cy="9" r="1.4"/></svg>
      </div>
      <h1>Galería</h1>
    </div>
    <span class="count" id="count">Cargando…</span>
    <label class="chk"><input type="checkbox" id="onlyBig"> Solo grandes (&ge;400px)</label>
    <select id="sort">
      <option value="size">Orden: tamaño</option>
      <option value="order">Orden: carga</option>
    </select>
    <button id="selAll">Seleccionar todo</button>
    <button id="selNone">Ninguno</button>
    <button id="dl" class="primary">Descargar seleccionadas (0)</button>
  </header>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="9" cy="9" r="1.4"/></svg>
    <div>No se capturaron imágenes.<br>
    Abre esta galería <b>después</b> de cargar y hacer scroll en la página, mantén la pestaña abierta y refresca si hace falta.</div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
